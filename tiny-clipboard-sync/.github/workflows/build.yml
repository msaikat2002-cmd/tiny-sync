name: Build Windows and Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Build Windows Project (Release x86)
      run: |
        msbuild windows/TinyClipboardSync.csproj `
          /p:Configuration=Release `
          /p:Platform=x86 `
          /p:TargetFrameworkVersion=v4.0 `
          /restore
      shell: pwsh
    
    - name: Verify Executable
      run: |
        if (Test-Path "windows/bin/x86/Release/TinyClipboardSync.exe") {
          Write-Host "Build successful!"
          Get-Item "windows/bin/x86/Release/TinyClipboardSync.exe" | Select-Object Name, Length
        } else {
          Write-Error "Executable not found!"
          exit 1
        }
      shell: pwsh
    
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TinyClipboardSync-Windows
        path: windows/bin/x86/Release/TinyClipboardSync.exe
        retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      working-directory: .
    
    - name: Build Android Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
    
    - name: Verify APK
      run: |
        if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
          echo "Build successful!"
          ls -lh android/app/build/outputs/apk/release/app-release.apk
        else
          echo "APK not found!"
          exit 1
        fi
    
    - name: Upload Android Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TinyClipboardSync-Android
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
